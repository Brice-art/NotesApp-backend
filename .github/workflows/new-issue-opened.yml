name: New issue opened

on:
  issues:
    types: [opened]

permissions:
  issues: write

env:
  MAINTAINER_GITHUB_USERNAME: ${{ secrets.MAINTAINER_GITHUB_USERNAME }}
  MAINTAINER_EMAIL: ${{ secrets.MAINTAINER_EMAIL }}
  SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = ['triage', 'bug', 'enhancement', 'documentation'];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: 'ededed',
                  });
                }
              }
            }

      - name: Add labels based on issue title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const labelsToAdd = ['triage'];

            if (title.includes('bug') || title.includes('error') || title.includes('fail')) {
              labelsToAdd.push('bug');
            }

            if (title.includes('feature') || title.includes('enhancement') || title.includes('request')) {
              labelsToAdd.push('enhancement');
            }

            if (title.includes('doc') || title.includes('documentation')) {
              labelsToAdd.push('documentation');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [...new Set(labelsToAdd)],
            });

      - name: Assign issue to maintainer
        if: ${{ env.MAINTAINER_GITHUB_USERNAME != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = process.env.MAINTAINER_GITHUB_USERNAME;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: [username],
            });
            core.info(`Assigned issue #${context.payload.issue.number} to ${username}`);

      - name: Comment on the issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Thanks for opening this issue! A maintainer will review it shortly.\n\n### Quick checklist\n- Provide steps to reproduce when applicable\n- Add screenshots, logs, or error messages if available\n- Include the expected vs actual behavior`
            });

      - name: Send email to maintainer
        if: ${{ env.MAINTAINER_EMAIL != '' && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT != '' && secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "New issue opened: ${{ github.event.issue.title }}"
          to: ${{ secrets.MAINTAINER_EMAIL }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            A new issue was opened in ${{ github.repository }}.

            Issue: #${{ github.event.issue.number }} - ${{ github.event.issue.title }}
            URL: ${{ github.event.issue.html_url }}
            Reporter: ${{ github.event.issue.user.login }}

            Please review it as soon as possible.
